name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # format:check는 기존 코드 전체가 아직 Prettier 포맷이 아니라 넣지 않았다.
      # 팀 전체가 한 번에 `npm run format`을 돌리는 커밋 이후에 추가한다.
      - name: Build
        run: npm run build
